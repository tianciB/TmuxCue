[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxcue"
version = "0.4.2"
description = "Keyboard-first Codex and Claude status indicators for native tmux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tianci Bi" }]
dependencies = []

[project.scripts]
tmuxcue = "tmuxcue.service:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
