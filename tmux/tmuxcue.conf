# BEGIN tmuxcue
# Values are written by an external systemd user service. These formats execute
# no shell commands and therefore cannot recursively spawn tmux clients.
set -g set-titles on
set -g set-titles-string '#{?#{@agent_title},#{@agent_title},tmux #S:#I:#W}'
set -g window-status-format ' #{@agent_icon} #I:#W#{?window_flags,#{window_flags}, } '
set -g window-status-current-format ' #{@agent_icon} #I:#W#{?window_flags,#{window_flags}, } '
# END tmuxcue
